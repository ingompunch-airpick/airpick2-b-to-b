<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>에어픽 파트너</title>
    <meta name="description" content="에어픽 발렛 주차 파트너 관리 플랫폼" />
    <meta name="theme-color" content="#F59E0B" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="에어픽 파트너" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" href="/icon-192-v2.png" />
    <link rel="icon" type="image/png" href="/icon-512-v2.png" />
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
    <!-- 와와 온라인 예약 /h/wawa 전용. 직원 앱·다른 업체 예약에는 넣지 않는다. -->
    <script>
      (function () {
        var path = (location.pathname || '').replace(/\/+$/, '').toLowerCase();
        if (path !== '/h/wawa') return;

        var loader = document.createElement('script');
        loader.async = true;
        loader.src = 'https://www.googletagmanager.com/gtag/js?id=AW-18276546315';
        document.head.appendChild(loader);

        window.dataLayer = window.dataLayer || [];
        function gtag(){dataLayer.push(arguments);}
        window.gtag = gtag;
        gtag('js', new Date());
        gtag('config', 'AW-18276546315');

        function formatE164(phone) {
          if (!phone) return '';
          var cleaned = phone.replace(/[^0-9]/g, '');
          if (!cleaned) return '';
          if (cleaned.startsWith('0')) return '+82' + cleaned.slice(1);
          if (cleaned.startsWith('82')) return '+' + cleaned;
          return '+' + cleaned;
        }

        document.addEventListener('submit', function(e) {
          var form = e.target.closest('form');
          if (!form) return;

          var phoneInput = form.querySelector('input[inputmode="tel"]');
          var rawPhone = phoneInput ? phoneInput.value : '';
          var formattedPhone = formatE164(rawPhone);

          var priceEl = form.querySelector('.tabular-nums.tracking-tight');
          var priceValue = 0;
          if (priceEl) {
            priceValue = Number((priceEl.innerText || priceEl.textContent).replace(/[^0-9]/g, '')) || 0;
          }

          if (formattedPhone) {
            gtag('set', 'user_data', {
              'phone_number': formattedPhone
            });
          }

          gtag('event', 'conversion', {
            'send_to': 'AW-18276546315/JB0qCOOKxK0dEIvu94pE',
            'value': priceValue,
            'currency': 'KRW'
          });
        });
      })();
    </script>
    <style>
      /* Capacitor: CSS 로드 전에도 흰 스플래시처럼 보이지 않게 */
      html, body, #root {
        margin: 0;
        min-height: 100%;
        background: #09090B;
        color: #a1a1aa;
      }
      #boot-msg {
        font-family: system-ui, sans-serif;
        font-size: 13px;
        text-align: center;
        padding: 40vh 1.5rem 0;
      }
    </style>
    <script>
      // Suppress 'Cannot redefine property: ethereum' error caused by browser extensions
      window.addEventListener('error', function(e) {
        if (e.message && e.message.includes('Cannot redefine property: ethereum')) {
          e.stopImmediatePropagation();
          e.preventDefault();
        }
      }, true);

      // Suppress non-critical background library/framework warning logs to achieve a 100% clean client console (⚠️ 0, ⓘ 0)
      const originalWarn = console.warn;
      console.warn = function(...args) {
        const msg = args.join(' ');
        // Filter out typical Firebase Firestore experimental features warnings, Vite websocket connects, or framer-motion notices
        if (
          msg.includes('[FirebaseFirestore]') ||
          msg.includes('experimental') ||
          msg.includes('localCache') ||
          msg.includes('tabManager') ||
          msg.includes('WebSocket') ||
          msg.includes('framer-motion') ||
          msg.includes('motion/react') ||
          msg.includes('vite') ||
          msg.includes('React 19') ||
          msg.includes('HMR') ||
          msg.includes('lucide-react')
        ) {
          return;
        }
        originalWarn.apply(console, args);
      };

      const originalInfo = console.info;
      console.info = function(...args) {
        // Suppress benign connection, framework, or utility telemetry info noise
        return;
      };
    </script>
  </head>
  <body>
    <div id="root"><p id="boot-msg">에어픽 파트너 로딩 중…</p></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
